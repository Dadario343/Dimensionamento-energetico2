{% extends "base.html" %}
{% block titulo %}Novo equipamento — {{ imovel.nome }}{% endblock %}
{% block conteudo %}
<div class="container container--estreito">
  <div class="container__cabecalho">
    <h1>Cadastrar equipamento</h1>
  </div>
  <p class="subtitulo-pagina">Imóvel: {{ imovel.nome }}</p>

  <form method="post" novalidate>
    <div class="campo">
      <label for="nome">Nome do equipamento</label>
      <input type="text" id="nome" name="nome" placeholder="Ex: Geladeira, Chuveiro" required />
    </div>

    <div class="campo">
      <label for="potencia">Potência (Watts)</label>
      <input type="number" step="0.01" min="0.01" id="potencia" name="potencia" placeholder="Ex: 1500" required />
    </div>

    <div class="campo">
      <label for="quantidade">Quantidade de equipamentos iguais</label>
      <input type="number" min="1" id="quantidade" name="quantidade" placeholder="Ex: 1" required />
    </div>

    <div class="campo">
      <label for="horas_dia">Tempo médio de uso por dia (horas)</label>
      <input type="number" step="0.01" min="0.01" max="24" id="horas_dia" name="horas_dia" placeholder="Ex: 3"
        required />
    </div>

    <button type="submit" class="botao-entrar">Cadastrar equipamento</button>
  </form>

  <p class="form-login__rodape">
    <a href="{{ url_for('detalhe_imovel', id_imovel=imovel.id) }}">Voltar para o imóvel</a>
  </p>
</div>
{% endblock %}
