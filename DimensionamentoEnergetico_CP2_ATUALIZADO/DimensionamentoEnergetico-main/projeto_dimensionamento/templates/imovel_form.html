{% extends "base.html" %}
{% block titulo %}{{ "Editar imóvel" if modo == "editar" else "Novo imóvel" }} — Dimensionamento Energético{% endblock
%}
{% block conteudo %}
<div class="container container--estreito">
  <div class="container__cabecalho">
    <h1>{{ "Editar imóvel" if modo == "editar" else "Novo imóvel" }}</h1>
  </div>

  <form method="post" novalidate>
    <div class="campo">
      <label for="nome">Nome do imóvel</label>
      <input type="text" id="nome" name="nome" placeholder="Ex: Casa, Apartamento"
        value="{{ imovel.nome if imovel else '' }}" required />
    </div>

    <div class="campo">
      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" name="endereco" placeholder="Endereço"
        value="{{ imovel.endereco if imovel else '' }}" />
    </div>

    <button type="submit" class="botao-entrar">
      {{ "Salvar alterações" if modo == "editar" else "Cadastrar imóvel" }}
    </button>
  </form>

  <p class="form-login__rodape">
    <a href="{{ url_for('listar_imoveis') }}">Voltar para meus imóveis</a>
  </p>
</div>
{% endblock %}
